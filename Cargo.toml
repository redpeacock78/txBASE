[workspace]
resolver = "2"
members = ["."]

[package]
name = "txbase"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "A small transactional dBASE-compatible database prototype"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
encoding_rs = "0.8"
futures = { version = "0.3", default-features = false, features = ["alloc", "async-await"] }
icu_collator = { version = "=2.1.1", default-features = false, features = ["compiled_data"] }
icu_locale = { version = "=2.1.1", default-features = false, features = ["compiled_data"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
unicode-normalization = "0.1.25"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bytes = "1"
fs2 = "0.4"
getrandom = "0.3"
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["client-legacy", "http1", "tokio"] }
openraft = { version = "=0.9.25", default-features = false, features = ["serde", "single-term-leader", "storage-v2"] }
sha2 = { version = "=0.10.9", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
rustls-platform-verifier = "0.7"
tokio = { version = "1", default-features = false, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tiny_http = { version = "0.12", features = ["ssl-rustls"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[target.'cfg(all(target_arch = "wasm32", target_os = "wasi", target_env = "p2"))'.dependencies]
wasip3 = "=0.9.0"

[dev-dependencies]
rcgen = "=0.13.2"

[[example]]
name = "wasi-query-stream"
crate-type = ["cdylib"]
path = "examples/wasi-query-stream.rs"

[[example]]
name = "wasi-query-stream-pending"
crate-type = ["cdylib"]
path = "examples/wasi-query-stream-pending.rs"

[[example]]
name = "wasi-object-store-check"
crate-type = ["cdylib"]
path = "examples/wasi-object-store-check.rs"
