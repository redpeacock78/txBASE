[workspace]
resolver = "2"
members = ["."]

[package]
name = "dbase-ng"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "A small transactional dBASE-compatible database prototype"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
