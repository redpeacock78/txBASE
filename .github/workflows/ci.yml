name: CI

on:
  push:
  pull_request:

jobs:
  docs:
    name: docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.33
      - run: bun install --frozen-lockfile
      - run: bun run lint:docs

  fuzz:
    name: bounded-fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Prepare fuzz corpus
        run: |
          corpus_root="$RUNNER_TEMP/txbase-fuzz"
          mkdir -p "$corpus_root/xbf" "$corpus_root/query_json"
          xxd -r -p tests/fixtures/query-stream-users.xbf.hex > "$corpus_root/xbf/query-stream-users.xbf"
          for seed in tests/corpus/xbf/*.hex; do
            xxd -r -p "$seed" "$corpus_root/xbf/$(basename "$seed" .hex)"
          done
          cp fuzz/corpus/query_json/* "$corpus_root/query_json/"
      - run: cargo fuzz run xbf_decode "$RUNNER_TEMP/txbase-fuzz/xbf" -- -runs=1000 -seed=1 -max_len=1048576 -timeout=10
      - run: cargo fuzz run query_json "$RUNNER_TEMP/txbase-fuzz/query_json" -- -runs=1000 -seed=1 -max_len=1048576 -timeout=10

  wasm:
    name: wasm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - run: cargo build --locked --lib --target wasm32-unknown-unknown --release
      - run: cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - run: wasm-bindgen target/wasm32-unknown-unknown/release/txbase.wasm --target nodejs --out-dir target/wasm-bindgen
      - run: node tests/wasm_smoke.mjs target/wasm-bindgen
      - run: node tests/wasm_edge_smoke.mjs target/wasm-bindgen
      - run: node tests/wasm_worker_smoke.mjs target/wasm-bindgen
      - run: node tests/wasm_query_stream_smoke.mjs target/wasm-bindgen

  wasi:
    name: wasi-query-stream
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
          version: "49.0.0"
      - run: cargo build --locked --example wasi-query-stream --target wasm32-wasip2 --release
      - run: bash tests/wasi_query_stream_smoke.sh target/wasm32-wasip2/release/examples/wasi_query_stream.wasm

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: bash scripts/check-doc-translations.sh
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo build --bin txbase
      - run: bash tests/e2e/cli_lifecycle.sh
      - run: cargo test --all-targets --all-features
