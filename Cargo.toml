[workspace]
resolver = "2"
members = ["."]

[package]
name = "txbase"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "A small transactional dBASE-compatible database prototype"

[dependencies]
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fs2 = "0.4"
tiny_http = "0.12"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
