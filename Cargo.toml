[workspace]
resolver = "2"
members = ["."]

[package]
name = "txbase"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "A small transactional dBASE-compatible database prototype"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
unicode-normalization = "0.1.25"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fs2 = "0.4"
tiny_http = "0.12"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[target.'cfg(all(target_arch = "wasm32", target_os = "wasi", target_env = "p2"))'.dependencies]
futures = { version = "0.3", default-features = false, features = ["async-await"] }
wasip3 = "=0.9.0"

[[example]]
name = "wasi-query-stream"
crate-type = ["cdylib"]
path = "examples/wasi-query-stream.rs"
