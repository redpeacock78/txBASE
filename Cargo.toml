[workspace]
resolver = "2"
members = ["."]

[package]
name = "txbase"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "A small transactional dBASE-compatible database prototype"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
encoding_rs = "0.8"
futures = { version = "0.3", default-features = false, features = ["alloc", "async-await"] }
icu_collator = { version = "=2.1.1", default-features = false, features = ["compiled_data"] }
icu_locale = { version = "=2.1.1", default-features = false, features = ["compiled_data"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
unicode-normalization = "0.1.25"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fs2 = "0.4"
openraft = { version = "=0.9.25", default-features = false, features = ["serde", "single-term-leader", "storage-v2"] }
sha2 = { version = "=0.10.9", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "sync", "time"] }
tiny_http = "0.12"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[target.'cfg(all(target_arch = "wasm32", target_os = "wasi", target_env = "p2"))'.dependencies]
wasip3 = "=0.9.0"

[dev-dependencies]
rcgen = "=0.13.2"

[[example]]
name = "wasi-query-stream"
crate-type = ["cdylib"]
path = "examples/wasi-query-stream.rs"
