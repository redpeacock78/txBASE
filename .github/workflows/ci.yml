name: CI

on:
  push:
  pull_request:

jobs:
  docs:
    name: docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.33
      - run: bun install --frozen-lockfile
      - run: bun run lint:docs

  wasm:
    name: wasm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - run: cargo build --locked --lib --target wasm32-unknown-unknown --release
      - run: cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - run: wasm-bindgen target/wasm32-unknown-unknown/release/txbase.wasm --target nodejs --out-dir target/wasm-bindgen
      - run: node tests/wasm_smoke.mjs target/wasm-bindgen
      - run: node tests/wasm_edge_smoke.mjs target/wasm-bindgen
      - run: node tests/wasm_worker_smoke.mjs target/wasm-bindgen

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: bash scripts/check-doc-translations.sh
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo build --bin txbase
      - run: bash tests/e2e/cli_lifecycle.sh
      - run: cargo test --all-targets --all-features
